name: Build golf-ml-runtime

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ML runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ml
          push: false
          tags: golf-ml-runtime:latest
