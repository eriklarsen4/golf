app = 'golf-analytics-rmc'
primary_region = 'lax'

[build]
  image = 'ghcr.io/eriklarsen4/golf-analytics:latest'

[processes]
  app = "/usr/bin/shiny-server"

[http_service]
  internal_port = 3838
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[registry]
  username = "eriklarsen4"
  password = "GHCR_PAT"